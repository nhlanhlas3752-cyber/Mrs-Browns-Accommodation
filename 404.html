<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Hilret Trust</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1729; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .wrap { max-width: 480px; }
    .code { font-family: 'Poppins', sans-serif; font-size: 6rem; font-weight: 900; line-height: 1; color: #FE6600; }
    h1 { font-family: 'Poppins', sans-serif; font-size: 1.6rem; font-weight: 700; color: #fff; margin: 12px 0 8px; }
    p { font-size: 0.95rem; color: rgba(255,255,255,.55); line-height: 1.7; margin-bottom: 28px; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.primary { display: inline-block; background: #FE6600; color: #fff; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 0.9rem; padding: 12px 28px; border-radius: 6px; text-decoration: none; }
    a.primary:hover { background: #e05500; }
    a.ghost { display: inline-block; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.7); font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.9rem; padding: 12px 28px; border-radius: 6px; text-decoration: none; }
    a.ghost:hover { border-color: #FE6600; color: #FE6600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Try navigating back to the homepage.</p>
    <div class="btns">
      <a href="/" class="primary">Go to Homepage</a>
      <a href="residences.html" class="ghost">Browse Rooms</a>
    </div>
  </div>
</body>
</html>
